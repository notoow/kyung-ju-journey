<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 배경 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#241e19" />
      <stop offset="100%" stop-color="#12100d" />
    </linearGradient>

    <!-- 금빛 포인트 그라디언트 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59b56" />
      <stop offset="50%" stop-color="#f0d399" />
      <stop offset="100%" stop-color="#c59b56" />
    </linearGradient>

    <!-- 은은한 광배 빛 -->
    <radialGradient id="haloGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#b3883b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#181512" stop-opacity="0" />
    </radialGradient>

    <!-- 석굴암 실루엣용 필터 -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <style>
    .font-pretendard {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    }
  </style>

  <!-- 메인 배경 -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 은은한 원형 광배 (Halo Glow) -->
  <circle cx="880" cy="315" r="280" fill="url(#haloGlow)" />

  <!-- 석굴암 본존불 은은한 실루엣 (우측 배경에 고요하고 웅장하게 배치) -->
  <g opacity="0.16" transform="translate(680, 80) scale(0.95)" fill="#f0d399">
    <!-- 두광 (머리 뒤 연화 광배) -->
    <circle cx="210" cy="170" r="130" stroke="#f0d399" stroke-width="4" fill="none" opacity="0.6" stroke-dasharray="8,6" />
    <circle cx="210" cy="170" r="105" stroke="#f0d399" stroke-width="2" fill="none" opacity="0.4" />

    <!-- 머리(육계/나발) 및 얼굴 윤곽 -->
    <path d="M 210,95 C 195,95 185,105 185,115 C 175,117 165,130 165,150 C 165,175 180,195 210,195 C 240,195 255,175 255,150 C 255,130 245,117 235,115 C 235,105 225,95 210,95 Z" />
    <!-- 귀 -->
    <path d="M 165,145 C 158,155 158,175 166,185" stroke="#f0d399" stroke-width="3" fill="none" />
    <path d="M 255,145 C 262,155 262,175 254,185" stroke="#f0d399" stroke-width="3" fill="none" />

    <!-- 목의 삼도(三道) -->
    <path d="M 185,200 Q 210,207 235,200" stroke="#f0d399" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 182,206 Q 210,214 238,206" stroke="#f0d399" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 179,212 Q 210,221 241,212" stroke="#f0d399" stroke-width="2" fill="none" opacity="0.7" />

    <!-- 어깨와 웅장한 법의 (가사) 실루엣 -->
    <path d="M 180,210 C 130,225 80,270 60,330 C 50,360 40,430 40,480 L 380,480 C 380,430 370,360 360,330 C 340,270 290,225 240,210 Z" />

    <!-- 항마촉지인 수인 (오른손은 무릎 아래로, 왼손은 가부좌 위에) -->
    <!-- 가부좌 하단 연화대좌 실루엣 -->
    <ellipse cx="210" cy="495" rx="190" ry="32" />
    <path d="M 20,495 C 20,530 400,530 400,495 Z" />
  </g>

  <!-- 장식 프레임 (전통 한옥 창살 느낌의 은은한 골드 테두리) -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#c59b56" stroke-width="1.5" opacity="0.35" rx="12" />
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#c59b56" stroke-width="0.8" opacity="0.2" rx="8" />

  <!-- 네 모서리 한국 전통 전통 문양 장식 -->
  <g stroke="#c59b56" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 44,64 L 64,64 L 64,44" />
    <path d="M 1156,64 L 1136,64 L 1136,44" />
    <path d="M 44,566 L 64,566 L 64,586" />
    <path d="M 1156,566 L 1136,566 L 1136,586" />
  </g>

  <!-- 좌측 텍스트 콘텐츠 레이아웃 (깔끔하고 품격 있는 타이포그래피) -->
  <!-- 카테고리 뱃지 -->
  <g transform="translate(80, 95)">
    <rect width="180" height="34" rx="17" fill="#9d3a2e" opacity="0.9" />
    <text x="90" y="22" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" class="font-pretendard" letter-spacing="2">
      환갑 기념 가족여행
    </text>
  </g>

  <!-- 메인 타이틀: 인생은 60부터 -->
  <text x="80" y="185" font-size="28" font-weight="600" fill="url(#goldGrad)" class="font-pretendard" letter-spacing="1">
    인생은 60부터, 찬란한 봄날처럼
  </text>

  <!-- 주인공 성함 및 여행 타이틀 -->
  <text x="80" y="260" font-size="56" font-weight="800" fill="#ffffff" class="font-pretendard" letter-spacing="-0.5">
    아빠 <tspan fill="#f0d399">박재성 님</tspan>의
  </text>
  <text x="80" y="325" font-size="52" font-weight="800" fill="#ffffff" class="font-pretendard" letter-spacing="-0.5">
    경주 환갑 힐링 여행
  </text>

  <!-- 골드 구분선 -->
  <line x1="80" y1="365" x2="340" y2="365" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- 일정 및 숙소 정보 -->
  <g transform="translate(80, 400)">
    <!-- 날짜 정보 -->
    <text x="0" y="24" font-size="20" font-weight="700" fill="#ffffff" class="font-pretendard">
      📅 2026. 10. 24 (생신 당일) ~ 10. 26 (2박 3일)
    </text>

    <!-- 숙소 정보 -->
    <text x="0" y="60" font-size="18" font-weight="500" fill="#d1c7bc" class="font-pretendard">
      🏡 숙소 : 스테이 시래 (고즈넉한 감성 독채 한옥)
    </text>

    <!-- 가족 멤버 구성 -->
    <text x="0" y="96" font-size="17" font-weight="500" fill="#a89d91" class="font-pretendard">
      👨‍👩‍👧‍👦 가족 5인 : 박재성 · 정화영 · 박정은 · 우탄 · 박정훈
    </text>
  </g>

  <!-- 하단 슬로건 -->
  <g transform="translate(80, 545)">
    <text x="0" y="0" font-size="15" font-weight="400" fill="#8c8071" class="font-pretendard" letter-spacing="0.5">
      천년고도 경주에서 온 가족이 함께 빚어내는 가장 따뜻하고 행복한 순간
    </text>
  </g>

  <!-- 우측 하단 워터마크 -->
  <text x="1110" y="550" font-size="13" font-weight="600" fill="#c59b56" opacity="0.6" text-anchor="end" class="font-pretendard" letter-spacing="1.5">
    KYUNGJU FAMILY JOURNEY 2026
  </text>
</svg>
